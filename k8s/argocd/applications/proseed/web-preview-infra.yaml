apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proseed-web-preview-infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/skkuding/proseed
    targetRevision: main
    path: infra/k8s/web-preview-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: proseed-preview
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
