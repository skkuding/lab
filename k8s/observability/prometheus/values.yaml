grafana:
  enabled: false

additionalPrometheusRulesMap:
  proseed-postgres-backup:
    groups:
      - name: proseed-postgres-backup
        rules:
          - alert: ProseedPostgresBackupFailed
            expr: |
              (
                kube_job_status_failed{
                  namespace="proseed-postgres",
                  job_name=~"postgres-backup-.*"
                } > 0
              )
              and on (namespace, job_name)
              (
                time() - kube_job_status_completion_time{
                  namespace="proseed-postgres",
                  job_name=~"postgres-backup-.*"
                } < 600
              )
            for: 1m
            labels:
              severity: critical
              service: proseed
              component: postgres-backup
            annotations:
              summary: ProSeed PostgreSQL backup failed
              description: >-
                Backup Job {{ $labels.job_name }} failed in namespace
                {{ $labels.namespace }}. Check the Job logs and the S3 upload result.

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - namespace
        - job_name
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'null'
    receivers:
      - name: 'null'
  alertmanagerSpec:
    alertmanagerConfigMatcherStrategy:
      type: None

extraManifests:
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: AlertmanagerConfig
    metadata:
      name: proseed-discord
      namespace: observability
    spec:
      route:
        receiver: proseed-discord
        groupBy:
          - alertname
          - namespace
          - job_name
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 1h
        matchers:
          - name: alertname
            value: ProseedPostgresBackupFailed
            matchType: =
          - name: namespace
            value: proseed-postgres
            matchType: =
      receivers:
        - name: proseed-discord
          discordConfigs:
            - apiURL:
                name: proseed-discord-webhook
                key: webhook-url
              sendResolved: false

prometheus:
  ingress:
    enabled: true
    hosts:
      - prometheus.lab.skkuding.dev
    paths:
      - /
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns01
      traefik.ingress.kubernetes.io/redirect-entry-point: https
    ingressClassName: traefik
    tls:
      - hosts:
          - prometheus.lab.skkuding.dev
        secretName: prometheus-tls
